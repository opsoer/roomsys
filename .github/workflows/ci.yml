name: CI

# 触发时机：推送到主分支、提交 PR、手动触发
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# 同一分支的新提交会取消旧的在跑任务，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  backend:
    name: 后端 (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go（版本取自 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 下载依赖
        run: go mod download

      - name: 编译
        run: go build ./...

      - name: 静态检查 (go vet)
        run: go vet ./...

      - name: 单元测试
        # 只做全包编译 + 运行验证；覆盖率由下一步门禁按「有测试的包」口径生成，
        # 避免无测试包的 0% 数据混入 profile
        run: go test ./...

      - name: 覆盖率门禁（核心包不低于阈值）
        # 阈值取「当前实测值附近」并随覆盖率提升逐步上调，作用是防止倒退，
        # 不是追求一次性达标。当前实测：audit 93.6 / migrations 54.2 / config 33.0 /
        # scheduler 22.3 / utils 63.3 / handlers 11.3 / services 8.7 / 合计 16.4
        # 注意：总覆盖率只统计「有测试文件的包」。不要改成 `go test ./... -coverprofile`：
        # 那样会把无测试包（cmd/、scripts/、models、logger 等）以 0% 并入 profile，
        # 分母膨胀后总覆盖率掉到 12.7%，且本机（缺 covdata 时剔除）与 CI（Linux 全并入）
        # 口径不一致，门禁会随机失败。
        run: |
          set -euo pipefail
          pkgs=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...)
          if [ -z "$pkgs" ]; then echo "::error::未找到任何含测试文件的包"; exit 1; fi
          check() {
            pkg="$1"; min="$2"
            pct=$(go test -cover "./${pkg}/..." 2>/dev/null | grep -o 'coverage: [0-9.]*%' | grep -o '[0-9.]*' | head -1)
            pct="${pct:-0}"
            echo "${pkg} 覆盖率: ${pct}% (门禁 ${min}%)"
            awk -v c="$pct" -v m="$min" 'BEGIN {exit !(c+0 >= m+0)}' || {
              echo "::error::${pkg} 覆盖率 ${pct}% 低于门禁 ${min}%"; exit 1;
            }
          }
          check audit 90
          check migrations 50
          check config 30
          check scheduler 20
          check utils 60
          check handlers 10
          check services 8
          go test -coverprofile=coverage.out -covermode=atomic $pkgs
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "全仓总覆盖率（有测试的包）: ${total}%"
          awk -v t="$total" 'BEGIN {exit !(t+0 >= 16)}' || {
            echo "::error::总覆盖率 ${total}% 低于门禁 16%"; exit 1;
          }

      - name: 竞态检测 (-race)
        # 说明：开发机为 windows/386，无法本地验证 -race；先以「报告不阻断」方式观察，
        # 确认无竞态后再改为阻断式门禁。
        continue-on-error: true
        run: go test -race ./...

      - name: 依赖漏洞扫描 (govulncheck)
        # 同样先以报告模式运行：若发现高危漏洞需评估是否可升级依赖，再改为阻断。
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: 上传覆盖率文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage.out
          retention-days: 7

  frontend:
    name: 前端 (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖（按 lock 文件精确安装）
        run: npm ci

      - name: 代码检查 (ESLint)
        run: npm run lint

      - name: 单元测试 (Vitest)
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 依赖漏洞扫描 (npm audit，仅生产依赖)
        # 只卡生产依赖：devDependencies 里 eslint-plugin-vue 9 链的 postcss 解析器
        # 为 moderate 级（构建期 DoS），升级需破坏性更换 eslint 插件栈，暂不阻断。
        run: npm audit --omit=dev --audit-level=high

  hygiene:
    name: 仓库卫生
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 敏感配置不得入库
        run: |
          for f in server/config.yaml server/config.local.yaml .env; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::敏感配置文件被提交，请确认 .gitignore 是否生效"
              exit 1
            fi
          done
          echo "OK: 未发现入库的敏感配置"

      - name: 文档不入库
        run: |
          if [ -n "$(git ls-files '*.md')" ]; then
            echo "::error::检测到 Markdown 文档入库："
            git ls-files '*.md'
            exit 1
          fi
          echo "OK: 无 Markdown 文档入库"

      - name: 数据库与日志不得入库
        run: |
          bad=$(git ls-files 'server/storage/*' 'server/logs/*' '*.db' '*.log')
          if [ -n "$bad" ]; then
            echo "::error::检测到数据库/日志入库："
            echo "$bad"
            exit 1
          fi
          echo "OK: 无数据库与日志入库"

  build-artifact:
    name: 构建产物
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 记录版本号
        id: version
        run: |
          sha=$(git rev-parse --short HEAD)
          echo "sha=$sha" >> $GITHUB_OUTPUT
          echo "构建版本: ${sha} ($(date -u '+%Y-%m-%dT%H:%M:%SZ'))"

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建后端二进制
        working-directory: server
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.Version=${{ steps.version.outputs.sha }}" \
            -o ../rental-server .

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 打包产物
        run: |
          mkdir -p dist
          cp rental-server dist/
          cp -r web/dist dist/web
          cd dist && tar -czf ../rental-server-${{ steps.version.outputs.sha }}.tar.gz .
          cd .. && rm -rf dist

      - name: 上传产物（含 commit sha，便于溯源）
        uses: actions/upload-artifact@v4
        with:
          name: rental-server-${{ steps.version.outputs.sha }}
          path: rental-server-*.tar.gz
          retention-days: 14
